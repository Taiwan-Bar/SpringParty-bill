<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>應用文搜查術</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-width: 1000px;
      margin: auto;
    }

    .gallery img {
      width: 375;
      height: 100%;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    @media (max-height: 1400px) {
      .gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

  <h1>應用文搜查術</h1>

  <div class="gallery">
    <img src="image/114010201new.png">
    <img src="image/114010202new.png">
    <img src="image/114070801new.png">
    <img src="image/114070802new.png">
    <img src="image/114111201new.png">
    <img src="image/114111202new.png">
    <img src="image/115010201new.png">
    <img src="image/115010201new.png">
  </div>

</body>
</html>
