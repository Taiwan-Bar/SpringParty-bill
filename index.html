<!DOCTYPE html> 
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>應用文搜查術</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #ef4e6a;
      text-align: center;
      color: #ffffff;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
      color: #ffde00;
    }
    

    .gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      max-width: 1200px;
      margin: auto;
    }

    /* 每個白框 */
    .item {
      width: 100%;
      aspect-ratio: 5 / 14; /* 等於 500x1400 */
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    /* 圖片 */
    .item img {
      width: 100%;
      height: 100%;
      object-fit: contain; /* 關鍵：不變形 + 留白 */
    }

    @media (max-width: 900px) {
      .gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

  <h1>應用文搜查術</h1>

  <br>
  <p>這四期發票總共有 <b>5個</b> 錯字，全部找到可以獲得 15 學分。<br>
  小提醒：只有有顏色的定番內容會有錯字，購買商品的明細不會有錯字。</p>
  <p>請記得在 20:00 把答案用 Slack 私訊給坤聖唷。</p>
  <br>
  
  <div class="gallery">
    <div class="item"><img src="image/114010201new.png"></div>
    <div class="item"><img src="image/114010202new.png"></div>
    <div class="item"><img src="image/114070801new.png"></div>
    <div class="item"><img src="image/114070802new.png"></div>
    <div class="item"><img src="image/114111201new.png"></div>
    <div class="item"><img src="image/114111202new.png"></div>
    <div class="item"><img src="image/115010201new.png"></div>
    <div class="item"><img src="image/115010202new.png"></div>
  </div>

</body>
</html>
