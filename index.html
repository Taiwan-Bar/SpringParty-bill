<!DOCTYPE html> 
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>應用文搜查術</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      max-width: 1200px;
      margin: auto;
    }

    /* 每個白框 */
    .item {
      width: 100%;
      aspect-ratio: 5 / 14; /* 等於 500x1400 */
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    /* 圖片 */
    .item img {
      width: 100%;
      height: 100%;
      object-fit: contain; /* 關鍵：不變形 + 留白 */
    }

    @media (max-width: 900px) {
      .gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

  <h1>應用文搜查術</h1>

  <div class="gallery">
    <div class="item"><img src="image/114010201new.png"></div>
    <div class="item"><img src="image/114010202new.png"></div>
    <div class="item"><img src="image/114070801new.png"></div>
    <div class="item"><img src="image/114070802new.png"></div>
    <div class="item"><img src="image/114111201new.png"></div>
    <div class="item"><img src="image/114111202new.png"></div>
    <div class="item"><img src="image/115010201new.png"></div>
    <div class="item"><img src="image/115010201new.png"></div>
  </div>

</body>
</html>
